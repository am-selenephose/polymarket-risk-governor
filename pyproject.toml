[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-research-risk-bot"
version = "0.2.0"
description = "Paper-first Polymarket research, structural scanning, Monte Carlo stress testing, and deterministic risk controls"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
polymarket-paper-bot = "bot.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["bot*", "risk*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
